# Round 3, requests-in-flight autoscaling: nginx + php-fpm (two containers) as a Knative Service.
# kubectl apply -n round3 -f rounds/round3
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: app
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        # requests in flight per Pod the autoscaler aims for
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/window: "60s"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "2"
    spec:
      containers:
      # nginx and php-fpm scale together - one Pod, two app containers
      - name: nginx
        image: nginx:1.29-alpine
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
          periodSeconds: 2
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: logs
          mountPath: /var/log/nginx
      - name: php-fpm
        image: ghcr.io/depeche-io/kubecon-2026-autoscaling-challenge/app-php:main
        env:
        # on purpose: 2 workers vs. Knative target 10 - most requests queue in the listen backlog
        - name: FPM_WORKERS
          value: "2"
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.5.3
        args: ["--nginx.scrape-uri=http://127.0.0.1:8080/stub_status"]
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi
      - name: log-exporter
        image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
        args: ["-config-file", "/etc/nginxlog/nginxlog-exporter.hcl"]
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginxlog
        - name: logs
          mountPath: /var/log/nginx
          readOnly: true
      - name: fpm-exporter
        image: hipages/php-fpm_exporter:2.2.0
        args: ["server", "--phpfpm.scrape-uri", "tcp://127.0.0.1:9000/fpm-status"]
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi
      volumes:
      - name: nginx-config
        configMap:
          name: app-nginx
      - name: logs
        emptyDir: {}

