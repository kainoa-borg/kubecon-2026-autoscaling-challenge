apiVersion: v1
kind: ConfigMap
metadata:
  name: app-nginx
data:
  nginx.conf: |
    worker_processes 5;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
      # nginx default
      worker_connections 512;
    }

    http {
      include /etc/nginx/mime.types;

      # tailed by the prometheus-nginxlog-exporter sidecar (requests by status code)
      log_format exporter '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
      access_log /var/log/nginx/access.log exporter;
      keepalive_timeout 65;

      server {
        listen 8080;
        root /usr/share/nginx/html;

        location = /healthz {
          access_log off;
          return 200 "ok\n";
        }

        # read by the nginx-prometheus-exporter sidecar
        location = /stub_status {
          access_log off;
          stub_status;
          allow 127.0.0.1;
          deny all;
        }

        # any path (and ?minWait=...&maxWait=... from k6) serves the static page
        location / {
          try_files /index.html =404;
        }
      }
    }
  nginxlog-exporter.hcl: |
    listen {
      port = 4040
      metrics_endpoint = "/metrics"
    }

    namespace "nginxlog" {
      format = "$remote_addr - $remote_user [$time_local] \"$request\" $status $body_bytes_sent \"$http_referer\" \"$http_user_agent\" $request_time"
      source {
        files = ["/var/log/nginx/access.log"]
      }
      histogram_buckets = [.005, .01, .025, .05, .1, .25, .5, 1, 2.5, 5, 10]
    }
