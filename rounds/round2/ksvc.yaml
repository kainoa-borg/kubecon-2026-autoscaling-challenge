# Round 2, requests-in-flight autoscaling: Go app with 10 workers as a Knative Service.
# kubectl apply -n round2 -f rounds/round2
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: app
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        # requests in flight per Pod the autoscaler aims for
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/window: "20s"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      containers:
      - image: ghcr.io/depeche-io/kubecon-2026-autoscaling-challenge/app-go:main
        env:
        - name: WORKERS
          value: "10"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
